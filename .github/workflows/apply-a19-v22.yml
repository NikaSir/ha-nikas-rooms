name: Apply Rooms A19 v2.2 migration

on:
  push:
    branches:
      - fix/a19-standard-v2-2
    paths:
      - scripts/apply_a19_v22.py
      - scripts/fix_a19_gate.py
      - .github/workflows/apply-a19-v22.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/a19-standard-v2-2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply A19 migration
        run: python scripts/apply_a19_v22.py
      - name: Align A19 repository gate
        run: python scripts/fix_a19_gate.py
      - name: Build autonomous production bundle
        run: python scripts/build_frontend.py
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run full validation
        run: |
          python scripts/build_frontend.py --check
          python -m pytest
          python scripts/check_repository.py
          node --check custom_components/nikas_rooms/frontend/nikas-rooms-panel.js
          node tests/registry_loader_harness.js
      - name: Remove one-shot and generated packaging files
        run: |
          git rm -f --ignore-unmatch scripts/apply_a19_v22.py scripts/fix_a19_gate.py .github/workflows/apply-a19-v22.yml
          rm -rf ./*.egg-info ./*/*.egg-info
      - name: Commit and push final migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate Rooms to NikaS UI v2.2 (A19)"
          git push origin HEAD:fix/a19-standard-v2-2
