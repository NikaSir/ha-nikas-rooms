name: Apply Rooms A08 A09 A10 patch

on:
  push:
    branches:
      - fix/a08-a10-a09-audit

permissions:
  contents: write

jobs:
  patch-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align one-shot patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply_a08_a09_a10_patch.py')
          text = path.read_text(encoding='utf-8')
          old_indent = "replace_once(FRONTEND, '          diagnosticDevices: areaDevices,', '          diagnosticDevices: relevantDevices,')"
          new_indent = "replace_once(FRONTEND, '        diagnosticDevices: areaDevices,', '        diagnosticDevices: relevantDevices,')"
          if text.count(old_indent) != 1:
              raise SystemExit('diagnosticDevices matcher drift')
          text = text.replace(old_indent, new_indent, 1)
          bs = chr(92)
          old_escape = f'text.index("{bs}n{bs}n  mountShell() {{")]'
          new_escape = f'text.index("{bs}{bs}n{bs}{bs}n  mountShell() {{")]'
          if text.count(old_escape) != 1:
              raise SystemExit('lifecycle test escape matcher drift')
          path.write_text(text.replace(old_escape, new_escape, 1), encoding='utf-8')
          PY
      - name: Apply exact audit patch
        run: |
          python scripts/apply_a08_a09_a10_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/registry_loader_harness.js')
          text = path.read_text(encoding='utf-8')
          old = 'lifecyclePanel._stateFrame = window.setTimeout(() => {}, 60_000);'
          new = 'lifecyclePanel._stateFrame = context.window.setTimeout(() => {}, 60_000);'
          if text.count(old) != 1:
              raise SystemExit('runtime harness timeout patch drift')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run Python tests
        run: python -m pytest
      - name: Run repository contract checks
        run: python scripts/check_repository.py
      - name: Run frontend syntax check
        run: node --check custom_components/nikas_rooms/frontend/nikas-rooms-panel.js
      - name: Remove one-shot machinery and commit result
        run: |
          git rm scripts/apply_a08_a09_a10_patch.py .github/workflows/apply-a08-a09-a10.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Rooms lifecycle navigation and area overrides (A08 A09 A10)"
          git push origin HEAD:fix/a08-a10-a09-audit
