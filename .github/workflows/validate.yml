name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest
      - run: python scripts/check_repository.py
      - run: node --check custom_components/nikas_rooms/frontend/nikas-rooms-panel.js
      - name: Verify pinned standard documents
        run: |
          python scripts/check_standard_documents.py
          python tests/test_standard_document_sync.py

