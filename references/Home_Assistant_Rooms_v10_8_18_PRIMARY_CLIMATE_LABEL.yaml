        template: "{% set op=label_devices('В эксплуатации') %}{% set svc=label_devices('На обслуживании') %}{% set rep=label_devices('Требует замены') %}{% set reserve=label_devices('Резерв') %}{% set retired=label_devices('Выведено из эксплуатации') %}\n{% set es=['binary_sensor.sensor_wo_zb_r2_contact', 'binary_sensor.sensor_wo_zb_r3_contact', 'camera.ds_n308p_b_0820200909ccrre78995839wcvu_301'] %}{% set ns=namespace(items=[]) %}\n{% for e in es %}\n  {% set d=device_id(e) %}\n  {% set vis=d and d not in reserve and d not in retired and (d in op or d in svc or d in rep) %}\n  {% if vis %}\n    {% set label=('На обслуживании' if d in svc else ('Требует замены' if d in rep else '')) %}\n    {% set nm=state_attr(e,'friendly_name') or e %}\n    {% set dom=e.split('.')[0] %}\n    {% if dom=='camera' %}\n      {% if label %}{% set shown_name=nm ~ ' · ' ~ label %}{% else %}{% set shown_name=nm %}{% endif %}\n      {% set c={'type':'picture-entity','entity':e,'name':shown_name,'camera_view':'live','show_name':true,'show_state':false,'tap_action':{'action':'more-info'},'hold_action':{'action':'more-info'}} %}\n    {% elif label %}\n{% set dc=state_attr(e,'device_class') or '' %}\n      {% if dom=='binary_sensor' and dc in ['door','window','garage_door','opening'] %}\n        {% set st=states(e) %}\n        {% if st in ['on','open'] %}\n          {% set access_state='Открыто' %}{% set access_color='yellow' %}{% set access_css='var(--warning-color)' %}\n        {% elif st in ['off','closed'] %}\n          {% set access_state='Закрыто' %}{% set access_color='grey' %}{% set access_css='var(--secondary-text-color)' %}\n        {% elif st=='opening' %}\n          {% set access_state='Открывается' %}{% set access_color='blue' %}{% set access_css='var(--primary-color)' %}\n        {% elif st=='closing' %}\n          {% set access_state='Закрывается' %}{% set access_color='blue' %}{% set access_css='var(--primary-color)' %}\n        {% elif st in ['unknown','unavailable','none',''] %}\n          {% set access_state='Нет данных' %}{% set access_color='red' %}{% set access_css='var(--error-color)' %}\n        {% else %}\n          {% set access_state='Неизвестное состояние' %}{% set access_color='red' %}{% set access_css='var(--error-color)' %}\n        {% endif %}\n        {% if dc=='door' %}\n          {% set nic=('mdi:door-open' if st in ['on','open','opening'] else ('mdi:door-alert' if access_color=='red' else 'mdi:door-closed')) %}\n        {% elif dc in ['window','opening'] %}\n          {% set nic=('mdi:window-open' if st in ['on','open','opening'] else ('mdi:window-closed-variant' if access_color=='red' else 'mdi:window-closed')) %}\n        {% elif dc=='garage_door' %}\n          {% set nic=('mdi:garage-open' if st in ['on','open','opening'] else ('mdi:garage-alert' if access_color=='red' else 'mdi:garage')) %}\n        {% endif %}\n        {% set cm='ha-card { --ha-tile-info-secondary-color: ' ~ access_css ~ '; }' %}\n        {% set c={'type':'custom:mushroom-template-card','entity':e,'primary':nm,'secondary':access_state ~ ' · ' ~ label,'icon':nic,'icon_color':access_color,'card_mod':{'prepend':true,'style':cm},'tap_action':{'action':'more-info'},'hold_action':{'action':'more-info'}} %}\n      {% else %}\n{% set dc=state_attr(e,'device_class') or '' %}\n    {% if dom=='binary_sensor' %}\n      {% if dc=='door' %}{% set nic=('mdi:door-open' if is_state(e,'on') else 'mdi:door-closed') %}\n      {% elif dc in ['window','opening'] %}{% set nic=('mdi:window-open' if is_state(e,'on') else 'mdi:window-closed') %}\n      {% elif dc=='garage_door' %}{% set nic=('mdi:garage-open' if is_state(e,'on') else 'mdi:garage') %}\n      {% elif dc in ['motion','occupancy','presence'] %}{% set nic='mdi:motion-sensor' %}\n      {% elif dc=='smoke' %}{% set nic='mdi:smoke-detector' %}\n      {% elif dc=='gas' %}{% set nic='mdi:gas-cylinder' %}\n      {% elif dc=='carbon_monoxide' %}{% set nic='mdi:molecule-co' %}\n      {% elif dc in ['moisture','problem'] %}{% set nic='mdi:alert-circle-outline' %}\n      {% else %}{% set nic='mdi:radiobox-marked' %}{% endif %}\n    {% elif dom=='light' %}{% set nic=('mdi:lightbulb-on' if is_state(e,'on') else 'mdi:lightbulb') %}\n    {% elif dom=='switch' %}{% set nic='mdi:power-socket-eu' %}\n    {% elif dom=='sensor' and dc=='illuminance' %}{% set nic='mdi:brightness-5' %}\n    {% elif dom=='sensor' and dc=='temperature' %}{% set nic='mdi:thermometer' %}\n    {% elif dom=='sensor' and dc=='humidity' %}{% set nic='mdi:water-percent' %}\n    {% elif dom=='media_player' %}{% set nic='mdi:speaker' %}\n    {% elif dom=='climate' %}{% set nic='mdi:thermostat' %}\n    {% else %}{% set nic='mdi:devices' %}{% endif %}\n      {% set c={'type':'custom:mushroom-template-card','entity':e,'primary':nm,'secondary':label,'icon':nic,'icon_color':('yellow' if d in svc else 'orange'),'tap_action':{'action':'more-info'},'hold_action':{'action':'more-info'}} %}\n      {% endif %}\n    {% else %}\n      {% set dc=state_attr(e,'device_class') or '' %}\n      {% set c={'type':'tile','entity':e,'tap_action':{'action':'more-info'},'hold_action':{'action':'more-info'},'icon_tap_action':{'action':'more-info'},'icon_hold_action':{'action':'more-info'}} %}\n      {% if dom=='binary_sensor' and dc in ['door','window','garage_door','opening'] %}\n        {% set cm=\"ha-card { --ha-tile-info-secondary-color: {% set s=states(config.entity) %}{% if s == 'on' %}var(--warning-color){% elif s == 'off' %}var(--secondary-text-color){% elif s in ['opening','closing'] %}var(--primary-color){% else %}var(--error-color){% endif %}; }\" %}\n        {% set c=dict(c, **{'card_mod':{'prepend':true,'style':cm}}) %}\n      {% endif %}\n    {% endif %}\n    {% set ns.items=ns.items+[c] %}\n  {% endif %}\n{% endfor %}\n{% if ns.items|length>0 %}{{ [{'type':'heading','heading':'Безопасность','heading_style':'title','icon':'mdi:shield-home-outline'},{'type':'grid','square':false,'columns':2,'cards':ns.items}] }}{% else %}{{ [] }}{% endif %}"
      grid_options:
        columns: full
